<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Voting</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="vote">
  <header class="topbar">
    <h1>Campus Voting</h1>
    <nav class="nav">
      <a href="index.html">Register / Login</a>
      <a href="candidates.html">Candidates &amp; Results</a>
      <a href="vote.html" class="active">Vote</a>
    </nav>
    <div class="wallet">
      <a id="adminLink" href="admin.html" hidden>Admin page</a>
      <span id="walletStatus">Wallet not connected</span>
      <button id="connectButton">Log in with wallet</button>
    </div>
  </header>
  <main>
    <section class="status-strip">
      <strong id="electionStatus">Log in with your wallet to continue.</strong>
      <span id="totalVotes"></span>
    </section>
    <div id="app" hidden>
      <section class="panel"><h2>Your voter status</h2><p id="voterStatus"></p></section>
      <section class="panel"><h2>Cast your vote</h2><p class="hint">One authorized wallet, one vote. You cannot change it after confirming.</p><div id="candidateList"></div></section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
